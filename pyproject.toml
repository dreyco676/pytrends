[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytrends"
version = "5.0.0"
description = "Pseudo API for Google Trends"
readme = "README.md"
urls = {homepage = "https://github.com/dreyco676/pytrends"}
requires-python = ">=3.12"
authors = [
    {name = "John Hogue"},
    {name = "Burton DeWilde"},
    {email = "dreyco676@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
keywords = [
    "google trends api search"
]
dependencies = [
    "requests>=2.32.4",
    "pandas>=2.2.2",
    "urllib3>=1.26.5",
]

[project.optional-dependencies]
socks = ["requests[socks]"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-recording",
    "responses",
    "ruff>=0.17.3",
]

[tool.setuptools]
packages = ["pytrends"]

[tool.setuptools.package-data]
pytrends = ["py.typed"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov pytrends/ -m 'not live' --block-network"
markers = [
    "live: calls the real Google Trends API; deselected by default",
]
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "C90"]
# E226 (missing space around arithmetic operator) is ignored by flake8 by default too.
ignore = ["E226"]

[tool.ruff.lint.mccabe]
max-complexity = 10
