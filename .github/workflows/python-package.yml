# Lint and test pytrends on every push and pull request to master.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Lint with ruff
        run: uv run --locked ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Test with pytest
        run: uv run --no-sync pytest --block-network

  lowest-direct:
    # Runs against the minimum declared runtime versions to catch floors that are too low.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install minimum declared runtime versions
        run: |
          uv venv --python 3.12 .venv-lowest
          uv pip install --python .venv-lowest/bin/python --resolution lowest-direct -e .
          uv pip install --python .venv-lowest/bin/python pytest pytest-cov pytest-recording responses
      - name: Test with pytest
        run: .venv-lowest/bin/python -m pytest --block-network
